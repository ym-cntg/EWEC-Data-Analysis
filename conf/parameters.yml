# UC2 Solar pipeline parameters.
# Every node reads its settings from here; change behaviour here, not in code.

run:
  output_schema: ewec_dev_powerops.scratch_yash   # all pipeline tables are written here
  start_date: "2024-01-23"                         # first forecast origin date (Gulf)
  end_date: ""                                     # last origin date; blank = yesterday
  product: dayahead_15min                          # key in `products` below

sites:
  # pv1 = small plant (~935 MW, east/west panels), pv2 = large plant (~1,584 MW). Capacities from the Phase 1 design doc.
  # NOTE: the Phase 1 doc names them the other way round (its PV1 = the large plant). We keep Reuniwatt / sensor naming.
  pv1:
    capacity_mw: 935
    lat: 24.45
    lon: 54.6
    target: actual                 # target = actual MW
    bronze_col_before_swap: PV2_MW # Bronze MW columns were mislabelled before ~Mar 2026
    bronze_col_after_swap: PV1_MW
  pv2:
    capacity_mw: 1584
    lat: 24.45
    lon: 54.6
    target: actual                 # target = actual MW (agreed 2026-10-17; Pv2_AVL no longer used)
    bronze_col_before_swap: PV1_MW
    bronze_col_after_swap: PV2_MW

data_engineering:
  gulf_offset_h: 4                 # Gulf Standard Time = UTC+4
  base_step_min: 5
  history_days_before_start: 3     # extra history read before start_date
  pv_sentinel_abs_mw: 5000         # |MW| above this is corrupt
  night_neg_floor_mw: -10          # -10..0 MW -> 0 (self-consumption); below -> invalid
  avl_max_mw: 2000
  swap_date: auto                  # Bronze MW column swap: auto | none | YYYY-MM-DD
  outage_clearsky_ghi: 200         # sunny if clear-sky GHI above this ...
  outage_share_of_capacity: 0.01   # ... and target below this share -> suspected outage
  reuniwatt:
    horizons: [dayahead, weekahead]
    keep_run_every_min: {intraday: 15, dayahead: 60, weekahead: 180}
    max_lead_min: 2880             # week-ahead kept only for its first 2 days (fallback / comparison)
  broken_run:                      # run forecasts darkness at midday -> not used
    high_sun_clearsky_ghi: 600
    dark_share_of_clearsky: 0.2
    min_high_sun_steps: 6
    max_dark_share: 0.5

products:
  dayahead_15min:
    resolution_min: 15
    origin_hours_gulf: [9, 15]
    window_min: 1440
    latency_min: 15                # a run counts as available 15 min after issue
    main_horizon: dayahead
    horizons:
      dayahead: {prefix: da, max_run_age_min: 360}
      weekahead: {prefix: wa, max_run_age_min: 1440}

feature_engineering:
  forecast_vars: [ghi, dni, dhi, bhi, gti_poa, power_mw, power_p10_mw, power_p90_mw]
  weather_vars: [temp_c, dewpoint_c, humidity_pct, cloud_opacity, clearness_index, pressure_hpa, precip_rate_mmh]
  around_target:                   # same run, neighbouring steps of the target
    columns: [ghi, gti_poa, power_mw, csi_ghi]
    lag_steps: [1, 2, 3]           # earlier steps (15 / 30 / 45 min)
    lead_steps: [1, 2, 3]          # later steps
    rolling_half_steps: [2, 4]     # centred windows of ±2 / ±4 steps (±30 / ±60 min): mean and std
  across_runs:                     # same target from earlier runs of the main horizon
    columns: [ghi, gti_poa, power_mw]
    offsets_min: [60, 180, 360]
  across_horizons:                 # main horizon minus other horizon, same target
    columns: [ghi, gti_poa, power_mw]
  actual_history:                  # act_*: actual output up to the origin (÷ capacity)
    enabled: true
    lag_minutes: [0, 15, 30, 45, 60, 120, 180]
    rolling_minutes: [60, 180]     # mean / std / min / max over the last 1 h and 3 h
    error_minutes: [60, 180]       # actual ÷ Reuniwatt over the last 1 h and 3 h
    same_slot_days: [1, 2]         # same clock slot 1 and 2 days earlier (only if known at the origin)
  extra:                           # cal_* month, ix_* interactions, day_* daily summaries of the forecast
    enabled: true

model_training:
  label: label_target_norm         # target ÷ capacity
  splits:                          # each split trains on origins BEFORE its test window
    phase1_window: {test_start: "2025-09-01", test_end: "2025-11-19"}   # Phase 1 backfill window (like-for-like)
    recent_3m: {holdout_months: 3}                                      # last 3 months
  exclude_feature_prefixes: []     # switch feature groups off, e.g. [act_, ix_, day_, cal_, xh_, da_r]
  recency_half_life_days: null     # e.g. 90 to weight recent days more (Phase 1 used ~17 days); null = off
  split_by_origin_hour: true       # separate models for the 09:00 and 15:00 forecasts
  min_train_rows: 100
  daytime:                         # models exist only for daytime target slots; forecast = 0 outside
    mode: clock                    # clock = fixed Gulf hours below | sun = whenever the sun is up (seasonal)
    start_hour_gulf: 6             # slot counts if its period END is after 06:00 ...
    end_hour_gulf: 18              # ... and at or before 18:00 (Gulf time)
  candidates:
    daytime: {}                    # one candidate; add more here to compare variants
  model:
    type: lightgbm                 # falls back to sklearn HistGradientBoosting if LightGBM is missing
    params:
      n_estimators: 400
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 20
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      verbose: -1
  mlflow:
    experiment: uc2_solar           # created under /Users/<you>/
    log_models: true

evaluation:
  mape_min_actual_mw: 150          # MAPE only where actual > 150 MW (Phase 1 rule, agreed)
